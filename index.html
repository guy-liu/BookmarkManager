<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-1: #667eea;
            --bg-2: #764ba2;
            --panel-bg: #ffffff;
            --panel-alt: #f9f9f9;
            --panel-muted: #f0f0f0;
            --text: #333333;
            --text-muted: #666666;
            --border: #e0e0e0;
            --tile-bg: #f9f9f9;
            --tile-border: #e0e0e0;
            --header-accent: #667eea;
            --button-primary: #667eea;
            --button-primary-hover: #5568d3;
            --button-secondary: #f0f0f0;
            --button-secondary-hover: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        :root[data-theme="dark"] {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --panel-bg: #111827;
            --panel-alt: #1f2937;
            --panel-muted: #374151;
            --text: #e5e7eb;
            --text-muted: #cbd5e1;
            --border: #374151;
            --tile-bg: #111827;
            --tile-border: #374151;
            --header-accent: #8b5cf6;
            --button-primary: #8b5cf6;
            --button-primary-hover: #7c3aed;
            --button-secondary: #374151;
            --button-secondary-hover: #4b5563;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh;
            padding: 8px 20px 20px 20px;
            color: var(--text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        header h1 {
            font-size: 14px;
            color: var(--header-accent);
            line-height: 1;
            margin: 0;
            padding: 0;
        }

        .header-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: var(--button-primary);
            color: white;
            line-height: 1.2;
        }

        button:hover {
            background: var(--button-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: var(--button-secondary);
            color: var(--text);
        }

        button.secondary:hover {
            background: var(--button-secondary-hover);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="url"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            background: var(--panel-alt);
            color: var(--text);
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--header-accent);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            flex: 1;
        }

        .modal-buttons .cancel {
            background: var(--button-secondary);
            color: var(--text);
        }

        .modal-buttons .cancel:hover {
            background: var(--button-secondary-hover);
        }

        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            grid-auto-flow: dense;
        }

        .groups-column {
            display: flex;
            flex-direction: column;
            gap: 10px; /* reduced gap between groups for compactness */
            min-height: 100px;
            border: 2px dashed transparent;
            border-radius: 12px;
            padding: 4px;
            transition: all 0.2s ease;
        }

        .groups-column.dragging-over {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .group {
            background: var(--panel-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px var(--shadow);
            transition: all 0.3s ease;
        }

        .group.dragging {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .group.dragging-over {
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
            transform: scale(1.02);
        }

        .group-header {
            background: linear-gradient(135deg, var(--header-accent) 0%, var(--header-accent-2) 100%);
            color: var(--header-text, #ffffff);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            user-select: none;
            min-height: 36px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.18);
        }

        .group-header.dragging {
            opacity: 0.7;
        }

        .group-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.1;
            margin: 0;
            padding: 0;
        }

        .group-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .group-move-buttons {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .group-move-buttons button,
        .small-action-btn {
            padding: 3px 6px;
            font-size: 12px;
            min-width: 26px;
            line-height: 1;
        }

        .group-move-buttons button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
        }

        .group-move-buttons button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .small-action-btn {
            background: var(--button-primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1;
        }

        .small-action-btn:hover {
            background: var(--button-primary-hover);
        }

        .group-content {
            padding: 20px;
        }

        .bookmarks-grid {
            display: flex;
            flex-direction: column;
            gap: 6px; /* tighter spacing between bookmark tiles */
            margin-bottom: 12px;
        }

        .bookmark {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 6px;
            height: var(--tile-size, 120px);
            background: var(--tile-bg);
            border: 2px solid var(--tile-border);
            border-radius: 6px;
            cursor: move;
            transition: all 0.18s ease;
            position: relative;
            overflow: hidden;
        }

        .bookmark:hover {
            background: var(--panel-muted);
            border-color: var(--header-accent);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.2);
        }

        .bookmark.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .bookmark-icon {
            --bookmark-icon-size: min(calc(var(--tile-size, 120px) * 0.44), calc(var(--tile-size, 120px) - 20px));
            box-sizing: border-box;
            width: var(--bookmark-icon-size);
            height: var(--bookmark-icon-size);
            min-width: var(--bookmark-icon-size);
            min-height: var(--bookmark-icon-size);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-muted);
            overflow: hidden;
            margin: 0;
            padding: 0;
            flex-shrink: 0;
        }

        .bookmark-icon > span,
        .bookmark-icon > img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            margin: 0;
            padding: 0;
            line-height: 1;
            font-size: calc(var(--bookmark-icon-size) * 0.52);
        }

        /* Compact mode: shorter tile without shrinking the icon itself */
        .compact-tiles .bookmark {
            height: calc(var(--tile-size, 120px) / 2);
            padding: 0 6px;
        }

        .bookmark-info {
            flex: 1;
            min-width: 0;
        }

        .bookmark-title {
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
            padding: 0;
            line-height: 1.1;
        }

        .bookmark-url {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .bookmark-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bookmark:hover .bookmark-actions {
            opacity: 1;
        }

        .bookmark-actions button {
            padding: 4px 8px;
            font-size: 12px;
            background: #667eea;
            border: none;
        }

        .bookmark-actions button.delete {
            background: #e74c3c;
        }

        .bookmark-actions button.delete:hover {
            background: #c0392b;
        }

        .add-bookmark-btn {
                    box-sizing: border-box;
                    width: 100%;
                    height: var(--tile-size, 120px);
                    padding: 0 6px;
                    background: var(--tile-bg);
                    border: 2px dashed var(--tile-border);
                    border-radius: 6px;
                    cursor: pointer;
                    font-size: 14px;
                    color: var(--text-muted);
                    transition: all 0.3s ease;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                }

                .compact-tiles .add-bookmark-btn {
                    height: calc(var(--tile-size, 120px) / 2);
                }

                .add-bookmark-btn:hover {
                    background: var(--panel-alt);
                    border-color: var(--header-accent);
                    color: var(--header-accent);
                }

        .add-group-btn {
            width: 100%;
            padding: 20px;
            background: var(--panel-bg);
            border: 2px dashed var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-muted);
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .add-group-btn:hover {
            background: var(--panel-alt);
            border-color: var(--header-accent);
            color: var(--header-accent);
        }

        .settings-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px var(--shadow);
            display: none;
        }

        .settings-panel.active {
            display: block;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-item label {
            margin: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .header-buttons {
                width: 100%;
                justify-content: center;
            }

            .bookmarks-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            .modal-content {
                width: 95%;
            }
        }

        .icon-preview {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-muted);
            border-radius: 8px;
            font-size: 32px;
            margin: 10px 0;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .import-preview {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
        }

        .import-preview-item {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }

        .import-preview-item:last-child {
            border-bottom: none;
        }

        .import-preview-title {
            font-weight: 500;
            color: var(--text);
        }

        .import-preview-url {
            font-size: 11px;
            color: var(--text-muted);
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Bookmark Manager</h1>
            <div class="header-buttons">
                <button onclick="toggleSettings()">⚙️ Settings</button>
                <button onclick="openBulkImportModal()" class="secondary">📋 Bulk Import</button>
                <button onclick="exportBookmarks()" class="secondary">⬇️ Export</button>
                <button onclick="importBookmarks()" class="secondary">⬆️ Import</button>
                <button onclick="openAddGroupModal()" class="secondary">➕ Group</button>
            </div>
        </header>

        <div class="settings-panel" id="settingsPanel">
            <h2 style="margin-bottom: 20px;">Settings</h2>
            <div class="settings-grid">
                <div class="setting-item">
                    <label for="tileSize">Tile Size (px):</label>
                    <input type="number" id="tileSize" min="80" max="200" value="120" onchange="updateSettings()">
                </div>
                <div class="setting-item">
                    <label for="displayMode">Display Mode:</label>
                    <select id="displayMode" onchange="updateSettings()">
                        <option value="icon-left">Icon + Title</option>
                        <option value="icon-top">Icon on Top</option>
                        <option value="icon-only">Icon Only</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="columns">Columns per Group:</label>
                    <input type="number" id="columns" min="1" max="10" value="auto" onchange="updateSettings()">
                </div>
                <div class="setting-item">
                    <label for="showUrlInTile" style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="showUrlInTile" onchange="updateSettings()">
                        Show URL on each tile
                    </label>
                </div>
                <div class="setting-item">
                    <label for="themeSelect">Theme:</label>
                    <select id="themeSelect" onchange="updateSettings()">
                        <option value="indigo">Indigo</option>
                        <option value="sunset">Sunset</option>
                        <option value="ocean">Ocean</option>
                        <option value="forest">Forest</option>
                        <option value="plum">Plum</option>
                        <option value="coral">Coral</option>
                        <option value="slate">Slate</option>
                        <option value="emerald">Emerald</option>
                    </select>
                </div>
                <div class="setting-item">
                    <button onclick="resetAllData()" class="secondary" style="width: 100%; margin-top: 8px;">Reset All Data</button>
                </div>
            </div>
        </div>

        <div class="groups-container" id="groupsContainer"></div>

        <button class="add-group-btn" onclick="openAddGroupModal()">➕ Add New Group</button>
    </div>

    <!-- Add/Edit Bookmark Modal -->
    <div class="modal" id="bookmarkModal">
        <div class="modal-content">
            <div class="modal-header">Add Bookmark</div>
            <form onsubmit="saveBookmark(event)">
                <div class="form-group">
                    <label for="bookmarkTitle">Title *</label>
                    <input type="text" id="bookmarkTitle" placeholder="e.g., Google" required>
                </div>
                <div class="form-group">
                    <label for="bookmarkUrl">URL *</label>
                    <input type="url" id="bookmarkUrl" placeholder="e.g., https://google.com" required>
                </div>
                <div class="form-group">
                    <label for="bookmarkIcon">Icon (leave empty for auto-fetch)</label>
                    <input type="text" id="bookmarkIcon" placeholder="e.g., emoji or URL">
                    <div class="icon-preview" id="iconPreview"></div>
                </div>
                <div class="form-group">
                    <label for="bookmarkGroup">Group *</label>
                    <select id="bookmarkGroup" required></select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="cancel" onclick="closeModal('bookmarkModal')">Cancel</button>
                    <button type="submit">Save Bookmark</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Group Modal -->
    <div class="modal" id="groupModal">
        <div class="modal-content">
            <div class="modal-header">Add Group</div>
            <form onsubmit="saveGroup(event)">
                <div class="form-group">
                    <label for="groupName">Group Name *</label>
                    <input type="text" id="groupName" placeholder="e.g., Work, Personal" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="cancel" onclick="closeModal('groupModal')">Cancel</button>
                    <button type="submit">Create Group</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Group Modal -->
    <div class="modal" id="editGroupModal">
        <div class="modal-content">
            <div class="modal-header">Edit Group</div>
            <form onsubmit="updateGroup(event)">
                <div class="form-group">
                    <label for="editGroupName">Group Name *</label>
                    <input type="text" id="editGroupName" placeholder="Group name" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="cancel" onclick="closeModal('editGroupModal')">Cancel</button>
                    <button type="submit">Update Group</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bulk Import Modal -->
    <div class="modal" id="bulkImportModal">
        <div class="modal-content">
            <div class="modal-header">Bulk Import Bookmarks</div>
            <form onsubmit="bulkImportBookmarks(event)">
                <div class="form-group">
                    <label for="bulkImportGroup">Target Group *</label>
                    <select id="bulkImportGroup" required></select>
                </div>
                <div class="form-group">
                    <label for="bulkImportText">Paste Bookmark List *</label>
                    <textarea id="bulkImportText" placeholder="Paste title and URL on alternate lines:&#10;Google&#10;https://google.com&#10;&#10;Facebook&#10;https://facebook.com" required></textarea>
                    <div class="import-preview" id="importPreview" style="display: none;"></div>
                </div>
                <div style="font-size: 12px; color: #999; margin-top: 10px;">
                    Format: Enter title on one line, URL on the next line. Blank lines are ignored.
                </div>
                <div class="modal-buttons">
                    <button type="button" class="cancel" onclick="closeModal('bulkImportModal')">Cancel</button>
                    <button type="submit">Import Bookmarks</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
